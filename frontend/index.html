<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CTI Ops Platform: phishing campaign clustering and sector ransomware / access-broker tracking." />
    <title>CTI Ops Platform</title>
    <script>
      // Apply the saved theme and presentation mode before first paint (no flash).
      (function () {
        try {
          var t = localStorage.getItem("ctiops-theme");
          if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
          if (new URLSearchParams(location.search).get("present") === "1") document.documentElement.dataset.present = "1";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
