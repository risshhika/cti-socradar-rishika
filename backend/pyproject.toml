[project]
name = "ctiops"
version = "0.1.0"
description = "CTI Ops platform: phishing campaign clustering (P4) and sector threat landscape / IAB & ransomware tracker (P6)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "feedparser>=6.0",
  "python-dateutil>=2.9",
  "tldextract>=5.1",
  "jinja2>=3.1",
  "anthropic>=0.40",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
